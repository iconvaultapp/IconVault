<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone App Portrait Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder screen content below with your own screenshot image. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; font-family: system-ui, sans-serif; padding: 24px; }
  .phone { width: 320px; background: #1c1c1e; border-radius: 44px; padding: 12px; box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
  .screen { position: relative; height: 660px; background: #f7f4ee; border-radius: 34px; overflow: hidden; padding: 20px 18px; }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 100px; height: 26px; border-radius: 999px; background: #000; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-top: 34px; }
  .top b { font-size: 20px; color: #1c1c1e; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #0d7a68; }
  .hero { margin-top: 20px; background: #0d7a68; color: #fff; border-radius: 18px; padding: 20px; }
  .hero h1 { font-size: 22px; line-height: 1.2; }
  .hero p { font-size: 13px; opacity: .85; margin-top: 8px; }
  .hero span { display: inline-block; margin-top: 14px; background: #fff; color: #0d7a68; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; }
  .row { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 14px; padding: 14px; margin-top: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  .thumb { width: 44px; height: 44px; border-radius: 12px; background: #d9ebe6; flex-shrink: 0; }
  .row b { font-size: 14px; color: #1c1c1e; display: block; }
  .row span { font-size: 12px; color: #6b7280; }
  .nav { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; justify-content: space-around; background: #fff; border-radius: 999px; padding: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .1); font-size: 12px; font-weight: 700; color: #0d7a68; }
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <div class="island"></div>
    <div class="top"><b>Good morning</b><div class="avatar"></div></div>
    <div class="hero"><h1>Your app, framed beautifully</h1><p>Replace this placeholder screen with your own screenshot.</p><span>Get started</span></div>
    <div class="row"><div class="thumb"></div><div><b>Feature one</b><span>Short supporting line</span></div></div>
    <div class="row"><div class="thumb"></div><div><b>Feature two</b><span>Short supporting line</span></div></div>
    <div class="row"><div class="thumb"></div><div><b>Feature three</b><span>Short supporting line</span></div></div>
    <div class="nav"><span>Home</span><span>Search</span><span>Saved</span><span>Profile</span></div>
  </div></div>
</body>
</html>
