<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Dashboard Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder screen content below with your own screenshot image. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; font-family: system-ui, sans-serif; padding: 24px; }
  .monitor { width: 860px; background: #1c1c1e; border-radius: 16px; padding: 12px; box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
  .screen { height: 500px; background: #f7f4ee; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: 190px 1fr; }
  .side { background: #0f2e29; color: #fff; padding: 22px 18px; font-size: 13px; }
  .side b { font-size: 16px; }
  .side div { margin-top: 16px; opacity: .8; }
  .main { padding: 24px; }
  .main h1 { font-size: 22px; color: #1c1c1e; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
  .stat { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  .stat span { font-size: 12px; color: #6b7280; }
  .stat b { display: block; font-size: 20px; margin-top: 4px; color: #0d7a68; }
  .panel { background: #fff; border-radius: 12px; padding: 18px; margin-top: 14px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  .panel b { font-size: 14px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid #eee; font-size: 13px; color: #374151; }
  .row:first-of-type { border-top: 0; }
  .neck { width: 90px; height: 46px; margin: 0 auto; background: #b9b9be; }
  .foot { width: 380px; height: 12px; margin: 0 auto; background: #c9c9ce; border-radius: 8px 8px 4px 4px; }
</style>
</head>
<body>
  <div><div class="monitor"><div class="screen">
    <div class="side"><b>Workspace</b><div>Overview</div><div>Analytics</div><div>Customers</div><div>Settings</div></div>
    <div class="main"><h1>Overview</h1>
      <div class="stats"><div class="stat"><span>Visitors</span><b>84,210</b></div><div class="stat"><span>Orders</span><b>3,412</b></div><div class="stat"><span>Revenue</span><b>$96,400</b></div><div class="stat"><span>Churn</span><b>1.2%</b></div></div>
      <div class="panel"><b>Recent orders</b><div class="row"><span>Order #1042</span><span>$129.00</span></div><div class="row"><span>Order #1041</span><span>$84.50</span></div><div class="row"><span>Order #1040</span><span>$210.00</span></div><div class="row"><span>Order #1039</span><span>$56.75</span></div></div>
    </div>
  </div></div><div class="neck"></div><div class="foot"></div></div>
</body>
</html>
