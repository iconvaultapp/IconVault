<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet Dashboard Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder screen content below with your own screenshot image. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; font-family: system-ui, sans-serif; padding: 24px; }
  .tablet { width: 760px; background: #1c1c1e; border-radius: 28px; padding: 14px; box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
  .screen { height: 520px; background: #f7f4ee; border-radius: 18px; overflow: hidden; display: grid; grid-template-columns: 180px 1fr; }
  .side { background: #0f2e29; color: #fff; padding: 22px 18px; font-size: 13px; }
  .side b { font-size: 16px; }
  .side div { margin-top: 16px; opacity: .8; }
  .main { padding: 24px; }
  .main h1 { font-size: 22px; color: #1c1c1e; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .stat { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  .stat span { font-size: 12px; color: #6b7280; }
  .stat b { display: block; font-size: 22px; margin-top: 4px; color: #0d7a68; }
  .chart { background: #fff; border-radius: 14px; padding: 18px; margin-top: 14px; height: 220px; display: flex; align-items: flex-end; gap: 14px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); }
  .bar { flex: 1; border-radius: 8px 8px 0 0; background: #0d7a68; }
  .bar.soft { background: #bfe0d8; }
</style>
</head>
<body>
  <div class="tablet"><div class="screen">
    <div class="side"><b>Dashboard</b><div>Overview</div><div>Projects</div><div>Reports</div><div>Settings</div></div>
    <div class="main"><h1>Overview</h1>
      <div class="stats"><div class="stat"><span>Users</span><b>12,480</b></div><div class="stat"><span>Revenue</span><b>$48,210</b></div><div class="stat"><span>Growth</span><b>+18%</b></div></div>
      <div class="chart"><div class="bar" style="height:40%"></div><div class="bar soft" style="height:60%"></div><div class="bar" style="height:50%"></div><div class="bar soft" style="height:75%"></div><div class="bar" style="height:65%"></div><div class="bar soft" style="height:90%"></div><div class="bar" style="height:80%"></div></div>
    </div>
  </div></div>
</body>
</html>
