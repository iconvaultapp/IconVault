<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Business Card Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder name, role and colours below with your own brand. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #e8e2d6, #d9ebe6); font-family: system-ui, sans-serif; padding: 32px; }
  .desk { position: relative; width: 720px; height: 460px; }
  .card { position: absolute; width: 420px; height: 240px; border-radius: 16px; padding: 28px 30px; box-shadow: 0 24px 48px rgb(0 0 0 / .25); }
  .front { left: 20px; top: 30px; background: #fff; transform: rotate(-6deg); }
  .front .mark { width: 44px; height: 44px; border-radius: 12px; background: #0d7a68; }
  .front h2 { font-size: 22px; color: #1c1c1e; margin-top: 42px; }
  .front p { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .front .contact { margin-top: 18px; font-size: 12px; color: #374151; }
  .back { right: 10px; bottom: 20px; background: #0d7a68; color: #fff; transform: rotate(5deg); display: grid; place-items: center; text-align: center; }
  .back .mark { width: 56px; height: 56px; border-radius: 16px; background: #fff; opacity: .95; }
  .back b { font-size: 24px; letter-spacing: 1px; }
  .back span { font-size: 12px; opacity: .85; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="desk">
    <div class="card front"><div class="mark"></div><h2>Your Name</h2><p>Your Role, Your Company</p><div class="contact">hello@yourbrand.com &nbsp;|&nbsp; yourbrand.com &nbsp;|&nbsp; +00 000 000 0000</div></div>
    <div class="card back"><div><div class="mark" style="margin: 0 auto 16px"></div><b>YOUR BRAND</b><br><span>Tagline goes here</span></div></div>
  </div>
</body>
</html>
