<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop Landing Page Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder screen content below with your own screenshot image. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; font-family: system-ui, sans-serif; padding: 24px; }
  .laptop { width: 820px; }
  .lid { background: #1c1c1e; border-radius: 18px 18px 0 0; padding: 12px 12px 0; box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
  .screen { height: 480px; background: #f7f4ee; border-radius: 10px 10px 0 0; overflow: hidden; padding: 22px 30px; }
  .nav { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #1c1c1e; }
  .nav b { font-size: 17px; color: #0d7a68; }
  .nav span { margin-left: 18px; }
  .hero { text-align: center; margin-top: 52px; }
  .hero h1 { font-size: 38px; line-height: 1.1; color: #1c1c1e; }
  .hero p { color: #6b7280; margin-top: 12px; font-size: 15px; }
  .hero a { display: inline-block; margin-top: 20px; background: #0d7a68; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 24px; border-radius: 999px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 40px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 2px 8px rgb(0 0 0 / .06); text-align: left; }
  .card i { display: block; width: 36px; height: 36px; border-radius: 10px; background: #d9ebe6; }
  .card b { display: block; margin-top: 10px; font-size: 14px; }
  .card span { font-size: 12px; color: #6b7280; line-height: 1.5; display: block; margin-top: 4px; }
  .base { height: 14px; margin: 0 -36px; background: #d8d8dc; border-radius: 0 0 18px 18px; }
  .base::after { content: ""; display: block; width: 120px; height: 5px; margin: 0 auto; background: #aeaeb2; border-radius: 0 0 8px 8px; }
</style>
</head>
<body>
  <div class="laptop"><div class="lid"><div class="screen">
    <div class="nav"><b>Brand</b><div><span>Features</span><span>Pricing</span><span>About</span></div></div>
    <div class="hero"><h1>Your landing page,<br>on a laptop</h1><p>Replace this placeholder screen with your own screenshot.</p><a href="#">Get started</a></div>
    <div class="cards"><div class="card"><i></i><b>Fast</b><span>Short supporting line for this feature.</span></div><div class="card"><i></i><b>Simple</b><span>Short supporting line for this feature.</span></div><div class="card"><i></i><b>Reliable</b><span>Short supporting line for this feature.</span></div></div>
  </div></div><div class="base"></div></div>
</body>
</html>
