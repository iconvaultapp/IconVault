<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Social Banner Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder headline and colours below with your own brand. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; font-family: system-ui, sans-serif; padding: 32px; }
  .browser { width: 860px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 48px rgb(0 0 0 / .25); }
  .bar { display: flex; align-items: center; gap: 6px; background: #ececf0; padding: 10px 14px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; }
  .bar span { flex: 1; margin-left: 8px; background: #fff; border-radius: 999px; height: 22px; }
  .banner { padding: 56px 48px; background: linear-gradient(120deg, #0f2e29, #0d7a68 60%, #34a08d); color: #fff; }
  .banner .tag { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: .85; }
  .banner h1 { font-size: 44px; line-height: 1.05; margin-top: 14px; max-width: 620px; }
  .banner p { font-size: 16px; opacity: .9; margin-top: 14px; max-width: 520px; line-height: 1.5; }
  .banner a { display: inline-block; margin-top: 22px; background: #fff; color: #0d7a68; font-weight: 700; font-size: 14px; text-decoration: none; padding: 11px 24px; border-radius: 999px; }
  .profile { display: flex; align-items: center; gap: 14px; padding: 20px 48px; }
  .profile .ava { width: 52px; height: 52px; border-radius: 50%; background: #0d7a68; border: 3px solid #fff; margin-top: -52px; box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
  .profile b { font-size: 16px; color: #1c1c1e; }
  .profile span { font-size: 13px; color: #6b7280; display: block; }
</style>
</head>
<body>
  <div class="browser">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span></span></div>
    <div class="banner"><div class="tag">Your brand tagline</div><h1>A banner headline that says one clear thing</h1><p>Replace this headline and supporting line with your own brand message.</p><a href="#">Learn more</a></div>
    <div class="profile"><div class="ava"></div><div><b>Your Brand</b><span>@yourbrand &nbsp;|&nbsp; yourbrand.com</span></div></div>
  </div>
</body>
</html>
