<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone App Landscape Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder screen content below with your own screenshot image. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #f2f0ea; font-family: system-ui, sans-serif; padding: 24px; }
  .phone { width: 680px; background: #1c1c1e; border-radius: 44px; padding: 12px; box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
  .screen { position: relative; height: 340px; background: #f7f4ee; border-radius: 34px; overflow: hidden; padding: 24px 28px; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 100px; height: 24px; border-radius: 999px; background: #000; }
  .hero h1 { font-size: 26px; line-height: 1.15; color: #1c1c1e; margin-top: 26px; }
  .hero p { font-size: 14px; color: #6b7280; margin-top: 10px; line-height: 1.5; }
  .hero span { display: inline-block; margin-top: 16px; background: #0d7a68; color: #fff; font-size: 13px; font-weight: 700; padding: 9px 18px; border-radius: 999px; }
  .card { background: #fff; border-radius: 18px; padding: 18px; margin-top: 26px; box-shadow: 0 2px 10px rgb(0 0 0 / .06); }
  .card .img { height: 110px; border-radius: 12px; background: linear-gradient(135deg, #d9ebe6, #0d7a68); }
  .card b { display: block; margin-top: 12px; font-size: 15px; color: #1c1c1e; }
  .card span { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <div class="phone"><div class="screen">
    <div class="island"></div>
    <div class="hero"><h1>Wide screens, same story</h1><p>Replace this placeholder screen with your own landscape screenshot.</p><span>Explore</span></div>
    <div class="card"><div class="img"></div><b>Card one</b><span>Short supporting line</span></div>
    <div class="card"><div class="img"></div><b>Card two</b><span>Short supporting line</span></div>
  </div></div>
</body>
</html>
