<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Letterhead Mockup</title>
<!-- IconVault Original mockup template. Replace the placeholder brand and text below with your own content. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; background: #e8e2d6; font-family: Georgia, serif; padding: 32px; }
  .sheet { width: 560px; min-height: 720px; background: #fff; padding: 56px 56px 40px; box-shadow: 0 24px 48px rgb(0 0 0 / .22); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 22px; border-bottom: 3px solid #0d7a68; }
  .head b { font-size: 24px; color: #1c1c1e; font-family: system-ui, sans-serif; letter-spacing: .5px; }
  .head span { font-size: 11px; color: #6b7280; font-family: system-ui, sans-serif; text-align: right; line-height: 1.6; }
  .date { margin-top: 34px; font-size: 13px; color: #374151; font-family: system-ui, sans-serif; }
  .title { margin-top: 26px; font-size: 20px; color: #1c1c1e; }
  .line { height: 9px; border-radius: 999px; background: #e5e7eb; margin-top: 14px; }
  .line.short { width: 62%; }
  .line.mid { width: 82%; }
  .sign { margin-top: 52px; }
  .sign .rule { width: 180px; border-top: 1px solid #1c1c1e; padding-top: 6px; font-size: 12px; color: #374151; font-family: system-ui, sans-serif; }
  .foot { margin-top: 60px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 11px; color: #9ca3af; font-family: system-ui, sans-serif; text-align: center; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="head"><b>YOUR BRAND</b><span>hello@yourbrand.com<br>yourbrand.com<br>Your City, Country</span></div>
    <div class="date">October 31, 2026</div>
    <div class="title">A letter that looks like it means business</div>
    <div class="line"></div><div class="line mid"></div><div class="line"></div><div class="line short"></div><div class="line"></div><div class="line mid"></div>
    <div class="sign"><div class="rule">Your Name, Your Role</div></div>
    <div class="foot">Your Brand &nbsp;|&nbsp; Street Address &nbsp;|&nbsp; Phone &nbsp;|&nbsp; Email</div>
  </div>
</body>
</html>
